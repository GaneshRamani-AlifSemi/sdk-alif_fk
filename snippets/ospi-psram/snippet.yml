name: ospi-psram

boards:
  /alif_b.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: b1_ospi0.overlay
      EXTRA_CONF_FILE: prj.conf
  /alif_e1c.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: e1c_ospi0.overlay
      EXTRA_CONF_FILE: prj.conf
  /alif_(e3|e5|e7).*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: e7_ospi0.overlay
      EXTRA_CONF_FILE: prj.conf
  /alif_e8_dk.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: e8_ek_s80_hex_spi1.overlay
      EXTRA_CONF_FILE: prj.conf
  /alif_e8_ak.*/:
    append:
      EXTRA_DTC_OVERLAY_FILE: e8_ak_aps_hex_spi0.overlay
      EXTRA_CONF_FILE: prj.conf
